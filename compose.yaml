services:
  raven:
    build: .
    image: raven:local
    container_name: raven
    ports:
      - "8080:8080"
    volumes:
      - raven-data:/data
    environment:
      TZ: America/Sao_Paulo
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      THESPORTSDB_API_KEY: ${THESPORTSDB_API_KEY:-}
    restart: unless-stopped

volumes:
  raven-data:
